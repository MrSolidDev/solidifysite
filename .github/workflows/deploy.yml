name: Deploy Solidify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/apps/solidifysite

            git fetch origin
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing /opt/apps/solidifysite/.env"
              exit 1
            fi

            docker compose up -d --build --remove-orphans
            docker compose exec -T api python -m scripts.seed
            docker compose exec -T api python -m scripts.create_admin

            for attempt in $(seq 1 12); do
              if docker compose exec -T web wget -q --spider http://127.0.0.1/health; then
                break
              fi
              sleep 5
            done

            docker compose exec -T web wget -q --spider http://127.0.0.1/health
            docker compose exec -T web wget -qO- http://127.0.0.1/api/projects > /dev/null
